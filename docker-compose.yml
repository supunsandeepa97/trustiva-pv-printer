version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB:       trustiva_pv
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-TruSt!v@2024}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/src/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV:                production
      PORT:                    4000
      DB_HOST:                 db
      DB_PORT:                 5432
      DB_NAME:                 trustiva_pv
      DB_USER:                 postgres
      DB_PASSWORD:             ${DB_PASSWORD:-TruSt!v@2024}
      JWT_SECRET:              ${JWT_SECRET:-change_this_secret_in_production_32chars}
      JWT_REFRESH_SECRET:      ${JWT_REFRESH_SECRET:-change_this_refresh_secret_32chars}
      JWT_EXPIRES_IN:          8h
      JWT_REFRESH_EXPIRES_IN:  7d
      CORS_ORIGIN:             http://localhost:3000
      UPLOAD_DIR:              /app/uploads
      PDF_DIR:                 /app/generated-pdfs
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - pdfs:/app/generated-pdfs
    ports:
      - "4000:4000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://backend:4000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  pdfs:
